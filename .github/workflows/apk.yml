# ============================================================
# ASIGNAPP — compilación del APK
#
# Sube este repositorio a GitHub y este flujo genera el APK solo.
# El archivo queda en la pestaña "Actions" -> la ejecución -> "Artifacts".
#
# Para que la app apunte a tu Supabase, crea dos secretos del
# repositorio (Settings -> Secrets and variables -> Actions):
#   SUPABASE_URL
#   SUPABASE_ANON_KEY
# ============================================================
name: APK de ASIGNAPP

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar la web
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Construir APK de depuración
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Publicar el APK
        uses: actions/upload-artifact@v4
        with:
          name: asignapp-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
